<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_31 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_31" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_31');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const container = document.getElementById('boot-container');
const content = document.getElementById('main-content');

// Create startup sequence
const sequence = document.createElement('div');
sequence.className = 'fixed inset-0 z-[100] bg-[#111415] flex flex-col items-center justify-center overflow-hidden';
sequence.innerHTML = `
    <!-- Background scanlines/noise -->
    <div class="absolute inset-0 opacity-[0.03] pointer-events-none" 
         style="background-image: linear-gradient(0deg, transparent 50%, #00ff41 50%); background-size: 100% 4px;"></div>
    
    <!-- Logo Container -->
    <div class="relative flex flex-col items-center">
        <div id="logo-text" class="text-[#00ff41] font-bold text-4xl md:text-6xl tracking-tighter opacity-0 translate-y-4 transition-all duration-1000 ease-out">
            HAPPY EV WORLD
        </div>
        <div id="sub-text" class="text-white/40 font-medium text-xs md:text-sm tracking-[0.4em] mt-4 opacity-0 transition-all duration-1000 delay-500 ease-out uppercase">
            Electric Mobility. Live Better.
        </div>
        
        <!-- Loading Bar -->
        <div class="w-48 h-[2px] bg-white/10 mt-12 overflow-hidden rounded-full relative">
            <div id="progress-bar" class="absolute inset-0 bg-[#00ff41] w-0 transition-all duration-[1500ms] ease-in-out"></div>
        </div>
    </div>
`;

document.body.appendChild(sequence);

// Animation Timeline
setTimeout(() => {
    document.getElementById('logo-text').classList.remove('opacity-0', 'translate-y-4');
    document.getElementById('logo-text').classList.add('opacity-100', 'translate-y-0');
}, 100);

setTimeout(() => {
    document.getElementById('sub-text').classList.remove('opacity-0');
    document.getElementById('sub-text').classList.add('opacity-100');
}, 600);

setTimeout(() => {
    document.getElementById('progress-bar').style.width = '100%';
}, 800);

// Transition to main site
setTimeout(() => {
    sequence.style.transition = 'opacity 1s ease-in-out, transform 1.2s cubic-bezier(0.7, 0, 0.3, 1)';
    sequence.style.opacity = '0';
    sequence.style.transform = 'scale(1.05)';
    
    if (content) {
        content.style.transition = 'transform 1.2s cubic-bezier(0.7, 0, 0.3, 1), filter 1.2s ease-out';
        content.style.transform = 'scale(1)';
        content.style.filter = 'blur(0px)';
    }

    setTimeout(() => {
        sequence.remove();
    }, 1200);
}, 2800);

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_31 -->
</body>
</html>
